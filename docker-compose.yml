# ============================================================
# AI-Powered Smart Health Assistant — Multi-Container Orchestration
# Services:
#   1. postgres  → Production PostgreSQL 16 database
#   2. backend   → FastAPI + ML / NLP + Alembic + Voice processing
#   3. frontend  → React + Vite + Tailwind bundle served via Nginx
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: health_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_secure_pass
      POSTGRES_DB: health_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - health_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: health_assistant_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://health_user:health_secure_pass@postgres:5432/health_assistant
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173"
      ADMIN_SECRET: "admin2025"
      JWT_SECRET_KEY: "fyp-health-assistant-jwt-secret-key-change-in-prod"
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - health_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: health_assistant_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - health_net

volumes:
  postgres_data:
    driver: local

networks:
  health_net:
    driver: bridge
