name: CI Pipeline - Test, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install system dependencies (ffmpeg & curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Full Backend Automated Test Suite
        env:
          ADMIN_SECRET: "ci_test_admin_secret_2025"
          JWT_SECRET_KEY: "ci_jwt_secret_key"
        run: |
          python -m unittest discover -s Backend/tests -p "test_*.py" -v

      - name: Validate Alembic Migration Heads
        run: |
          cd Backend
          python -m alembic check || python -m alembic heads

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies (clean install)
        working-directory: Frontend
        run: npm ci

      - name: Build production bundle
        working-directory: Frontend
        run: npm run build

  docker-syntax-check:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config
