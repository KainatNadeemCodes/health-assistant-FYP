name: CI Pipeline - Test, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install system dependencies (ffmpeg & curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Train and Validate ML Model Artefacts
        working-directory: Backend
        run: |
          python train_model.py

      - name: Run Full Backend Automated Test Suite
        working-directory: Backend
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee test_results.log || (echo "### ❌ Test Suite Failure Log" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat test_results.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Validate Alembic Database Migrations
        working-directory: Backend
        run: |
          python -m alembic upgrade head

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies (clean install)
        working-directory: Frontend
        run: npm ci

      - name: Build production bundle
        working-directory: Frontend
        run: npm run build

  docker-syntax-check:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config
